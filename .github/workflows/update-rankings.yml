name: Update rankings and publish

on:
  workflow_dispatch:
  schedule:
    # Taipei time: 14:15, 15:30, 17:17, and 18:17. Early runs retry after
    # the close; later runs catch delayed exchange data and scheduled-run delays.
    - cron: "15 6 * * 1-5"
    - cron: "30 7 * * 1-5"
    - cron: "17 9 * * 1-5"
    - cron: "17 10 * * 1-5"
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Update public rankings
        run: python scripts/update_rankings.py

      - name: Commit updated rankings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- site/data/rankings.json; then
            echo "Rankings are already current."
          else
            git add site/data/rankings.json
            git commit -m "Update market rankings"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

