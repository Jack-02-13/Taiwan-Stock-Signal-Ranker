plugins {
    id 'com.android.application'
}

def releaseKeystorePath = System.getenv('TSR_RELEASE_KEYSTORE_FILE')
def releaseStorePassword = System.getenv('TSR_RELEASE_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('TSR_RELEASE_KEY_ALIAS')
def releaseKeyPassword = System.getenv('TSR_RELEASE_KEY_PASSWORD')
def releaseSigningConfigured = [releaseKeystorePath, releaseStorePassword, releaseKeyAlias, releaseKeyPassword]
        .every { it != null && !it.trim().isEmpty() }
def appProject = project

gradle.taskGraph.whenReady { taskGraph ->
    def buildsReleaseArtifact = taskGraph.allTasks.any { task ->
        task.project == appProject && task.name in ['packageRelease', 'bundleRelease']
    }
    if (buildsReleaseArtifact && !releaseSigningConfigured) {
        throw new GradleException('Release signing is not configured. Use the local release build script to provide the keystore credentials.')
    }
}

android {
    namespace 'com.example.taiwanstocktop3'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.example.taiwanstocktop3'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.1.1'
        resValue 'string', 'app_name', '台股前三名'
    }

    signingConfigs {
        if (releaseSigningConfigured) {
            release {
                storeFile file(releaseKeystorePath)
                storeType 'PKCS12'
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.preview'
            resValue 'string', 'app_name', '台股前三名（測試）'
        }

        release {
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
