<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f4f6f5">
    <meta name="description" content="依據台股 15 項技術訊號，查看最新交易日與前六個交易日的分數前三名。">
    <link rel="manifest" href="./manifest.webmanifest">
    <script>try { if (localStorage.getItem("taiwan-stock-ranker-theme") === "dark") { document.documentElement.dataset.theme = "dark"; document.querySelector('meta[name="theme-color"]').content = "#12171c"; } } catch {}</script>
    <link rel="stylesheet" href="./styles.css">
    <title>台股訊號排行</title>
  </head>
  <body>
    <main class="page-shell">
      <header class="page-header">
        <div class="brand-row">
          <div class="brand-mark" aria-hidden="true">15</div>
          <div>
            <p class="eyebrow">TAIWAN STOCK SCREENER</p>
            <h1>台股訊號排行</h1>
          </div>
          <div class="header-actions">
            <div class="theme-switch" id="theme-switch" role="group" aria-label="顯示模式">
              <span class="theme-indicator" aria-hidden="true"></span>
              <button class="theme-option" type="button" data-theme-choice="dark" aria-pressed="false">深色</button>
              <button class="theme-option" type="button" data-theme-choice="light" aria-pressed="true">淺色</button>
            </div>
            <button class="refresh-button" id="refresh-button" type="button" aria-label="更新資料">
              <span class="refresh-icon" aria-hidden="true">↻</span>
              <span class="refresh-label">更新資料</span>
            </button>
          </div>
        </div>
        <div class="header-meta">
          <span class="live-dot" aria-hidden="true"></span>
          <span id="data-status" role="status" aria-live="polite">讀取排行資料中…</span>
        </div>
      </header>

      <section class="latest-section" aria-labelledby="latest-title">
        <div class="section-heading">
          <div>
            <p class="section-kicker">LATEST SESSION</p>
            <h2 id="latest-title">最近交易日前三名</h2>
          </div>
          <div class="latest-date" id="latest-date">尚無資料</div>
        </div>
        <p class="section-caption" id="latest-summary">資料由證交所盤後行情計算。</p>
        <div class="ranking-list" id="latest-list" aria-live="polite"></div>
      </section>

      <section class="history-section" aria-labelledby="history-title">
        <div class="section-heading history-heading">
          <div>
            <p class="section-kicker">PREVIOUS SESSIONS</p>
            <h2 id="history-title">前六個交易日</h2>
          </div>
          <span class="heading-note">每格各列前三名</span>
        </div>
        <div class="history-grid" id="history-grid"></div>
      </section>

      <button class="method-link" id="method-link" type="button">詳細資料</button>

      <footer class="page-footer">
        <span class="creator-label">製作者：Jack-0213</span>
        <a class="footer-link" href="https://github.com/Jack-02-13/Taiwan-Stock-Signal-Ranker/releases/latest" target="_blank" rel="noopener noreferrer">下載 Android App</a>
        <button class="footer-link" id="disclaimer-link" type="button">免責聲明</button>
      </footer>
    </main>
    <div class="pull-refresh-indicator" id="pull-refresh-indicator" aria-hidden="true"><span></span></div>
    <div class="modal-overlay" id="modal-overlay" hidden>
      <section class="modal-card" id="modal-card" role="dialog" aria-modal="true" tabindex="-1" aria-labelledby="modal-title">
        <div id="modal-content"></div>
        <p class="modal-close-hint">點擊模糊處關閉</p>
      </section>
    </div>
    <script src="./app.js" defer></script>
  </body>
</html>
